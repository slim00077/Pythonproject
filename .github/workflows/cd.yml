name: CD

# Livraison continue : à chaque fusion dans main (ou lancement manuel) :
#   1. on rejoue toute la CI (rien n'est publié si un test échoue) ;
#   2. on construit l'image Docker et on la publie dans le registre GitHub (GHCR) ;
#   3. on déclenche le déploiement sur l'hébergeur (Render) puis on vérifie l'URL publique.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false      # un déploiement en cours n'est jamais interrompu

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publier l'image Docker (GHCR)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (GHCR exige des minuscules)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer en production
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: ${{ vars.LIVE_URL }}
    steps:
      - name: Vérifier la configuration du déploiement
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          LIVE: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$HOOK" ] || [ -z "$LIVE" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL ou variable LIVE_URL manquant (voir docs/DEPLOYMENT.md, étape 5)."
            exit 1
          fi

      - name: Déclencher le déploiement
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK"

      - name: Attendre que la nouvelle version réponde, puis test de fumée
        env:
          LIVE: ${{ vars.LIVE_URL }}
        run: |
          base="${LIVE%/}"
          echo "Attente de $base/healthz/ (le plan gratuit peut mettre plusieurs minutes à démarrer)..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$base/healthz/" || true)
            echo "essai $i : HTTP $code"
            [ "$code" = "200" ] && ok=1 && break
            sleep 15
          done
          [ "${ok:-0}" = "1" ] || { echo "::error::L'application n'a pas répondu à temps."; exit 1; }
          curl -fsS "$base/healthz/"
          curl -fsS -o /dev/null "$base/"
          curl -fsS -o /dev/null "$base/accounts/login/"
          echo "Déploiement vérifié : $base"
