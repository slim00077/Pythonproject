# Environnement complet en local : application + PostgreSQL.
#   docker compose up --build        puis   http://localhost:8000
# Variables facultatives (fichier .env à côté de ce fichier) : GEMINI_API_KEY, ANTHROPIC_API_KEY, ADMIN_PASSWORD...
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecoteams
      POSTGRES_USER: ecoteams
      POSTGRES_PASSWORD: ecoteams-local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoteams -d ecoteams"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: ecoteams:local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-secret-key-change-me-0123456789abcdef}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      DJANGO_SECURE_COOKIES: "False"
      DB_ENGINE: postgresql
      POSTGRES_DB: ecoteams
      POSTGRES_USER: ecoteams
      POSTGRES_PASSWORD: ecoteams-local-only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SEED_DEMO_DATA: "1"
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo12345!pass}
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-Admin-Local-2026!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - media:/app/media

volumes:
  pgdata:
  media:
