{% load eco_tags %}
{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}
    <a class="btn btn-ghost btn-sm" href="{% querystring page=page.previous_page_number %}">{% icon 'arrow-left' 16 %} Précédent</a>
  {% endif %}
  <span class="current">Page {{ page.number }} sur {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn btn-ghost btn-sm" href="{% querystring page=page.next_page_number %}">Suivant {% icon 'arrow-right' 16 %}</a>
  {% endif %}
</nav>
{% endif %}
