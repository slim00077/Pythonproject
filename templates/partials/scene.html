{# Original local illustrations (no external image): kind = forest | ocean | recycling | energy #}
<svg viewBox="0 0 240 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="{{ label }}" focusable="false">
  <defs>
    <linearGradient id="sky-{{ kind }}" x1="0" y1="0" x2="0" y2="1">
      {% if kind == 'forest' %}<stop offset="0" stop-color="#143B3A"/><stop offset="1" stop-color="#0F1629"/>
      {% elif kind == 'ocean' %}<stop offset="0" stop-color="#16316E"/><stop offset="1" stop-color="#0F1629"/>
      {% elif kind == 'recycling' %}<stop offset="0" stop-color="#14353A"/><stop offset="1" stop-color="#101C33"/>
      {% else %}<stop offset="0" stop-color="#2A2A5E"/><stop offset="1" stop-color="#0F1629"/>{% endif %}
    </linearGradient>
  </defs>
  <rect width="240" height="140" fill="url(#sky-{{ kind }})"/>
  {% if kind == 'forest' %}
    <circle cx="190" cy="32" r="14" fill="#B7FF4A" opacity=".85"/><circle cx="190" cy="32" r="24" fill="#B7FF4A" opacity=".12"/>
    <path d="M0 108 Q60 84 120 100 T240 92 V140 H0Z" fill="#12372A"/>
    <g fill="#22C55E"><path d="M40 108 l16-52 16 52z"/><path d="M46 90 l10-40 10 40z" fill="#4ADE80"/>
      <path d="M92 112 l20-66 20 66z" fill="#16A34A"/><path d="M100 88 l12-48 12 48z" fill="#4ADE80"/>
      <path d="M150 110 l14-46 14 46z"/><path d="M200 112 l12-38 12 38z" fill="#16A34A"/></g>
    <g fill="#5C3D2E"><rect x="54" y="106" width="4" height="10"/><rect x="110" y="110" width="5" height="12"/><rect x="162" y="108" width="4" height="10"/><rect x="210" y="110" width="4" height="9"/></g>
    <path d="M0 122 Q70 110 150 124 T240 118 V140 H0Z" fill="#0B2A20"/>
  {% elif kind == 'ocean' %}
    <circle cx="48" cy="34" r="12" fill="#FFC857" opacity=".9"/><circle cx="48" cy="34" r="22" fill="#FFC857" opacity=".12"/>
    <path d="M0 70 Q30 60 60 70 T120 70 T180 70 T240 70 V140 H0Z" fill="#1E4FBF" opacity=".75"/>
    <path d="M0 88 Q30 78 60 88 T120 88 T180 88 T240 88 V140 H0Z" fill="#2563EB" opacity=".7"/>
    <path d="M0 108 Q30 98 60 108 T120 108 T180 108 T240 108 V140 H0Z" fill="#42E8D5" opacity=".38"/>
    <path d="M150 64 l22-30 4 30z" fill="#F4F7FB" opacity=".92"/><path d="M146 66 h38 l-6 8 h-26z" fill="#9B87F5"/>
    <g fill="none" stroke="#F4F7FB" stroke-opacity=".5" stroke-width="1.5"><path d="M90 96 q4-6 8 0 t8 0"/><path d="M30 112 q4-6 8 0 t8 0"/></g>
  {% elif kind == 'recycling' %}
    <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 58 L120 24 L144 58" stroke="#22C55E"/><path d="M158 74 L170 112 L128 106" stroke="#42E8D5"/><path d="M92 106 L66 112 L80 70" stroke="#B7FF4A"/>
    </g>
    <g fill="#F4F7FB" opacity=".9"><path d="M138 52 l10 8 -14 3z"/><path d="M132 108 l-12 -6 11 -9z"/><path d="M84 76 l-2 -13 12 6z"/></g>
    <circle cx="120" cy="80" r="40" fill="none" stroke="#5B8CFF" stroke-opacity=".25" stroke-dasharray="3 6"/>
  {% else %}
    <circle cx="200" cy="30" r="13" fill="#FFC857"/><circle cx="200" cy="30" r="24" fill="#FFC857" opacity=".15"/>
    <path d="M0 118 Q80 104 160 116 T240 112 V140 H0Z" fill="#12372A"/>
    <g fill="#F4F7FB"><rect x="58" y="62" width="4" height="56"/><rect x="146" y="72" width="3" height="46"/></g>
    <g stroke="#F4F7FB" stroke-width="3" stroke-linecap="round"><path d="M60 62 L60 30"/><path d="M60 62 L84 76"/><path d="M60 62 L38 76"/><path d="M147.5 72 L147.5 46"/><path d="M147.5 72 L168 83"/><path d="M147.5 72 L129 83"/></g>
    <g transform="translate(88 96) skewX(-12)"><rect width="40" height="22" fill="#2563EB"/><path d="M0 7h40M0 15h40M13 0v22M26 0v22" stroke="#9DB8FF" stroke-width="1"/></g>
    <path d="M172 118 l20 -16 h18 l-8 16z" fill="#1E40AF" opacity=".0"/>
  {% endif %}
</svg>
